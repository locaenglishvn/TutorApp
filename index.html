<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tag cấu hình cho iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Loca Tutor">
    
    <!-- Icon hiển thị khi Add to Home Screen trên iOS (iPhone/iPad) -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/bkp99s0/Logo-no-background.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/bkp99s0/Logo-no-background.png">
    
    <!-- Icon hiển thị trên Android & Trình duyệt Web -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/bkp99s0/Logo-no-background.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/bkp99s0/Logo-no-background.png">
    
    <!-- Liên kết đến file Manifest cho Android PWA -->
    <link rel="manifest" href="manifest.json">
    <title>Loca Tutor Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { width: 100%; height: 100%; border: none; outline: none; display: block; }
    </style>
</head>
<body>
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxUibWKiqR56JHsiSRiLH2aZMjFw_hpk7DxVOS9Hl9KC6Eww9wBZcgsZ3X4hDgrxFNpGQ/exec" allow="screen-wake-lock; autoplay; geolocation"></iframe>

    <!-- ✅ THÊM MỚI: Cầu nối lưu trữ - trang này lưu hộ iframe vì storage ở đây bền vững hơn -->
    <script>
      window.addEventListener('message', function(e) {
          alert("📩 Parent nhận được: " + JSON.stringify(e.data));   // ✅ THÊM TẠM DÒNG NÀY để test
        
          if (!e.data || e.data.source !== 'loca-storage-bridge') return;
          var iframeWin = document.getElementById('app-frame').contentWindow;
        
          if (e.data.action === 'set') {
            try { localStorage.setItem(e.data.key, e.data.value); } catch(err) {}
          } else if (e.data.action === 'remove') {
            try { localStorage.removeItem(e.data.key); } catch(err) {}
          } else if (e.data.action === 'get') {
            var val = null;
            try { val = localStorage.getItem(e.data.key); } catch(err) {}
            iframeWin.postMessage({ source: 'loca-storage-bridge', reqId: e.data.reqId, value: val }, '*');
          }
        });
    </script>
</body>
</html>
